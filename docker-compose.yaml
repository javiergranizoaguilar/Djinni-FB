# Despliegue completo del TFG Djinni-FB.
# Uso: docker compose up -d
# El tribunal solo necesita ejecutar ese comando. Todo lo demas
# (composer install, generacion de claves JWT, migraciones y fixtures)
# corre dentro del entrypoint del contenedor de backend.

services:

  database:
    image: mariadb:10.11
    container_name: djinni_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: app
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: djinni_php
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_SECRET: 7c3bb6f0f0c1a4b2d2c3e4f5a6b7c8d9
      DATABASE_URL: "mysql://app:app@database:3306/app?serverVersion=10.11.2-MariaDB&charset=utf8mb4"
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
      JWT_PASSPHRASE: tfg-djinni-jwt-passphrase-change-me
      JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
      JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'
      MAILER_DSN: 'null://null'
      MESSENGER_TRANSPORT_DSN: 'doctrine://default?auto_setup=0'
    volumes:
      - ./Djinni-B:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - jwt_keys:/var/www/html/config/jwt
    expose:
      - "9000"

  nginx:
    image: nginx:1.27-alpine
    container_name: djinni_nginx
    restart: unless-stopped
    depends_on:
      - php
    volumes:
      - ./Djinni-B:/var/www/html:ro
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

  workerman:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: djinni_ws
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      php:
        condition: service_started
    environment:
      APP_ENV: dev
      APP_SECRET: 7c3bb6f0f0c1a4b2d2c3e4f5a6b7c8d9
      DATABASE_URL: "mysql://app:app@database:3306/app?serverVersion=10.11.2-MariaDB&charset=utf8mb4"
      JWT_PASSPHRASE: tfg-djinni-jwt-passphrase-change-me
      JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
      JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
      MAILER_DSN: 'null://null'
      MESSENGER_TRANSPORT_DSN: 'doctrine://default?auto_setup=0'
    volumes:
      - ./Djinni-B:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - jwt_keys:/var/www/html/config/jwt
    entrypoint: ["/usr/local/bin/entrypoint-ws.sh"]
    command: ["php", "bin/console", "app:chat-server"]
    ports:
      - "8081:8081"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
        VITE_WS_URL: ws://localhost:8081
    container_name: djinni_front
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "5173:80"

volumes:
  db_data:
  backend_vendor:
  jwt_keys:
